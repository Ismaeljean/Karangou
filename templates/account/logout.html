{% extends "base.html" %}
{% load i18n %}

{% block title %}Déconnexion | Karangou Studios{% endblock %}

{% block content %}
<div class="d-flex align-items-center" style="min-height: 100vh; padding-top: 60px;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="glass-card p-5 text-center">
                    <h3 class="mb-4">Êtes-vous sûr de vouloir vous déconnecter ?</h3>
                    <form method="post" action="{% url 'utilisateurs:logout' %}">
                        {% csrf_token %}
                        {% if redirect_field_value %}
                            <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}">
                        {% endif %}
                        <button type="submit" class="btn btn-primary px-4">
                            Se déconnecter
                        </button>
                        <a href="{% url 'utilisateurs:index' %}" class="btn btn-outline-light px-4 ms-2">Annuler</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

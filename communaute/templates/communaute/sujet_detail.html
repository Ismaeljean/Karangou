{% extends "base.html" %}

{% block title %}Sujet | Karangou Studios{% endblock %}

{% block content %}
<div class="container py-5 mt-5">
    <a href="{% url 'communaute:forum' %}" class="text-white text-decoration-none mb-3 d-inline-block">
        <i class="bi bi-arrow-left"></i> Retour au forum
    </a>
    
    <div class="glass-card p-4 mb-4">
        <div class="d-flex justify-content-between mb-3">
            <h4>{{ sujet.titre }}</h4>
            <small class="text-white">{{ sujet.date|date:"d/m/Y H:i" }}</small>
        </div>
        <p class="mb-3">{{ sujet.contenu }}</p>
        <small class="text-white">Par {{ sujet.auteur.nom }} {{ sujet.auteur.prenom }}</small>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}Nouveau Sujet | Karangou Studios{% endblock %}

{% block content %}
<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="glass-card p-4">
                <h4 class="mb-4">Créer un nouveau sujet</h4>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Titre du sujet</label>
                        <input type="text" name="titre" class="form-control" required placeholder="Titre de votre sujet">
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label">Contenu</label>
                        <textarea name="contenu" class="form-control" rows="6" required placeholder="Exprimez-vous..."></textarea>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-send me-2"></i>Publier
                        </button>
                        <a href="{% url 'communaute:forum' %}" class="btn btn-outline-light">
                            Annuler
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

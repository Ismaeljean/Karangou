{% extends "base.html" %}

{% block title %}Ajouter une Réalisation | Karangou Studios{% endblock %}

{% block content %}
<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="glass-card p-4">
                <h4 class="mb-4">Ajouter une Réalisation</h4>
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Titre *</label>
                        <input type="text" name="titre" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description *</label>
                        <textarea name="description" class="form-control" rows="4" required></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Genre *</label>
                            <select name="genre" class="form-control" required>
                                <option value="">Choisir un genre</option>
                                {% for g in genres %}
                                <option value="{{ g }}">{{ g }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Durée (minutes) *</label>
                            <input type="number" name="duree" class="form-control" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Date de sortie *</label>
                        <input type="date" name="date_sortie" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Affiche (image)</label>
                        <input type="file" name="affiche" class="form-control" accept="image/*">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Vidéo</label>
                        <input type="file" name="video" class="form-control" accept="video/*">
                    </div>
                    <div class="mb-4">
                        <div class="form-check">
                            <input type="checkbox" name="est_publie" class="form-check-input" id="est_publie">
                            <label class="form-check-label" for="est_publie">Publier immédiatement</label>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Enregistrer</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
